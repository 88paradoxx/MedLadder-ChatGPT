name: Topic SEO audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/seo-topic-audit.mjs'
      - 'scripts/sync-social-metadata.mjs'
      - '.github/workflows/topic-seo-audit.yml'
      - 'subjects/**/*.html'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize social metadata
        run: node scripts/sync-social-metadata.mjs
      - name: Run repository-wide SEO audit
        run: node scripts/seo-topic-audit.mjs
      - name: Commit audit reports to working repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/topic-seo-audit.json audit-output/topic-seo-audit.md
          git commit -m 'Add repository-wide topic SEO audit report' || echo 'No report changes to commit'
          git push
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: medladder-topic-seo-audit
          path: audit-output/
          if-no-files-found: error
